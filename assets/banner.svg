<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title">
  <title id="title">Justin Ruiz Serrano: backend, cloud infrastructure and developer tooling</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.3" stop-color="#01030d"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Liberation Mono", monospace; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <text x="72" y="98" class="mono" font-size="18" fill="#a3a3a3">~/justin-chevere</text>
  <text x="72" y="162" class="sans" font-size="58" font-weight="700" fill="#ffffff">Justin Ruiz Serrano</text>
  <text x="72" y="208" class="sans" font-size="24" fill="#a3a3a3">Backend · Cloud infrastructure · Developer tooling</text>

  <rect x="72" y="236" width="502" height="38" rx="19" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.45"/>
  <circle cx="96" cy="255" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="112" y="261" class="sans" font-size="17" fill="#86efac" textLength="440" lengthAdjust="spacing">Open to Software/Programming, Data &amp; Cloud internships</text>

  <rect x="800" y="56" width="416" height="216" rx="12" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.14"/>
  <circle cx="824" cy="80" r="6" fill="#ff5f57"/>
  <circle cx="844" cy="80" r="6" fill="#febc2e"/>
  <circle cx="864" cy="80" r="6" fill="#28c840"/>
  <text x="1008" y="85" class="mono" font-size="13" fill="#737373" text-anchor="middle">worker · test-platform</text>
  <line x1="800" y1="100" x2="1216" y2="100" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="828" y="140" class="mono" font-size="18"><tspan fill="#a3a3a3">$ </tspan><tspan fill="#f5f5f5">python -m app.worker</tspan></text>
  <text x="828" y="172" class="mono" font-size="18" fill="#a3a3a3">claimed run #42 · attempt 1</text>
  <text x="828" y="204" class="mono" font-size="18"><tspan fill="#4ade80">✓ 92 passed</tspan><tspan fill="#a3a3a3"> in 32s</tspan></text>
  <text x="828" y="236" class="mono" font-size="18" fill="#a3a3a3">$</text>
  <rect x="850" y="221" width="10" height="20" fill="#f5f5f5">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
